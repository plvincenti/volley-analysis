[project]
name = "volley-analysis"
version = "0.1.0"
description = "Analyse vidéo de matchs de volley-ball amateur (computer vision)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ultralytics>=8.3",
    "lap>=0.5",
    "onnxruntime>=1.20",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "typer>=0.12",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
volley = "volley_analysis.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/volley_analysis"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
